name: Recover validated release publication

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: GitHub Actions run ID with a successful build-and-validate job
        required: true
        type: string
      release_tag:
        description: Exact release tag from that run, such as v0.1.0
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: whisperdesk-release-recovery-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  recover-publication:
    name: Verify artifact and resume release publication
    runs-on: windows-2025
    permissions:
      actions: read
      contents: write
    timeout-minutes: 45
    steps:
      - name: Require recovery workflow from main
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') { throw 'Run release recovery from the main branch.' }

      - name: Check out current release scripts
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: main
          fetch-depth: 0

      - name: Download previously validated release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: whisperdesk-release-${{ inputs.release_tag }}
          path: release-artifacts
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify successful source run, immutable tag, and artifact checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
        run: .\scripts\validate_release_recovery.ps1 -SourceRunId $env:SOURCE_RUN_ID -Tag $env:RELEASE_TAG -Repository $env:REPOSITORY -ArtifactRoot 'release-artifacts'

      - name: Install release tools
        shell: pwsh
        run: |
          if (!(Get-Command choco.exe -ErrorAction SilentlyContinue)) { throw 'Chocolatey CLI is not available on the release runner.' }
          if (!(Get-Command gh.exe -ErrorAction SilentlyContinue)) { throw 'GitHub CLI is not available on the release runner.' }

      - name: Validate publishing credentials
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
        run: .\scripts\validate_release_secrets.ps1

      - name: Verify or complete GitHub Release publication
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $release = Get-Content 'release-artifacts\build\release\release.json' -Raw | ConvertFrom-Json
          $installer = "release-artifacts\dist\installer\$($release.installer_name)"
          .\scripts\publish_github_release.ps1 -ContextPath 'release-artifacts\build\release\release.json' -Installer $installer -ChecksumFile "$installer.sha256"

      - name: Submit or verify Chocolatey package
        shell: pwsh
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          $release = Get-Content 'release-artifacts\build\release\release.json' -Raw | ConvertFrom-Json
          .\scripts\publish_chocolatey.ps1 -ContextPath 'release-artifacts\build\release\release.json' -Package "release-artifacts\build\chocolatey\whisperdesk.$($release.version).nupkg" -InstallerHash $release.sha256

      - name: Submit WinGet update or report pending bootstrap
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
        run: |
          $release = Get-Content 'release-artifacts\build\release\release.json' -Raw | ConvertFrom-Json
          .\scripts\publish_winget.ps1 -ContextPath 'release-artifacts\build\release\release.json' -InstallerHash $release.sha256
